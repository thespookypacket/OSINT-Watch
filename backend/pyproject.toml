[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-watch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "psycopg[binary,pool]==3.3.3",
  "pydantic-settings==2.9.1", "httpx==0.28.1", "shapely==2.1.2",
  "feedparser==6.0.11", "argon2-cffi==23.1.0", "PyYAML==6.0.3"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.10", "mypy==1.15.0", "types-PyYAML", "types-shapely"]

[tool.setuptools.package-data]
osint_watch = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["shapely.*", "feedparser"]
ignore_missing_imports = true
