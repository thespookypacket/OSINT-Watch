server:
  bind: {host: 0.0.0.0, port: 80}
  url: ${WATCH_PUBLIC_URL}/gis
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  language: en-US
  pretty_print: false
  limit: 100
  max_limit: 1000
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: OpenStreetMap contributors
logging:
  level: ERROR
metadata:
  identification:
    title: OSINT Watch public hazard features
    description: Read-only source-attributed events. Location and severity are source dependent.
    keywords: [hazards, osint, wildfire]
    keywords_type: theme
    terms_of_service: Retain per-feature source attribution.
    url: ${WATCH_PUBLIC_URL}
  license:
    name: Source-specific data terms
    url: ${WATCH_PUBLIC_URL}/api/docs
  provider: {name: OSINT Watch, url: '${WATCH_PUBLIC_URL}'}
  contact: {name: Administrator, role: pointOfContact}
resources:
  events:
    type: collection
    title: Public hazard events
    description: Source-attributed events available for export
    keywords: [hazards]
    extents:
      spatial: {bbox: [-180, -90, 180, 90], crs: 'http://www.opengis.net/def/crs/OGC/1.3/CRS84'}
    providers:
      - type: feature
        name: PostgreSQL
        data:
          host: db
          port: 5432
          dbname: watch
          user: watch_gis
          password: ${WATCH_DATABASE_PASSWORD}
        id_field: id
        time_field: updated_at
        table: export_events
        geom_field: geom
